schema_version: 1

context:
  version: "2.7.1"
  python_min: "3.10"

package:
  name: histoprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/histoprint/histoprint-${{ version }}.tar.gz
  sha256: b5ec8096a8c666b6eb6dbbc3385bdeb11c278711b7c6b2671cbf9afc7b1f3417

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - histoprint=histoprint.cli:histoprint

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - click >=7.0.0
    - numpy >=1.0.0
    - python >=${{ python_min }}
    - uhi >=0.2.1

tests:
  - python:
      imports:
        - histoprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - histoprint --help

about:
  license: MIT
  license_file: LICENSE
  summary: histoprint
  homepage: https://github.com/scikit-hep/histoprint
  repository: https://github.com/scikit-hep/histoprint

extra:
  recipe-maintainers:
    - conda-forge/scikit-hep
    - ast0815
