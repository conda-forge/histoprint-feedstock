{% set name = "histoprint" %}
{% set version = "2.7.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4fc1a27bf653eb22c9061f343f3c6efb9d1be0e8dfe53074a95a30170fe26b4e

build:
  number: 0
  noarch: python
  entry_points:
    - histoprint=histoprint.cli:histoprint
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
  run:
    - click >=7.0.0
    - numpy >=1.0.0
    - python >={{ python_min }}
    - uhi >=0.2.1

test:
  imports:
    - histoprint
  commands:
    - histoprint --help
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/scikit-hep/histoprint
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: histoprint
  dev_url: https://github.com/scikit-hep/histoprint

extra:
  recipe-maintainers:
    - conda-forge/scikit-hep
